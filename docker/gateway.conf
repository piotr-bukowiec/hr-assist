# Single public entry point (host port 3000). The browser sees one origin:
#   /api/auth/logout -> Next.js route handler (clears the cookie on the web side)
#   /api/*           -> NestJS (already prefixed with /api by setGlobalPrefix)
#   everything else  -> Next.js
# The auth cookie is host-only, so serving both from one origin keeps it working.

server {
    listen 3000;

    # Docker's embedded DNS; variables in proxy_pass make nginx re-resolve
    # service names, so it survives api/web container restarts (new IPs)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;
    set $web_upstream http://web:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location = /api/auth/logout {
        proxy_pass $web_upstream;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
